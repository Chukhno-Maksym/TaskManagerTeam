{% extends "base.html" %}

{% block content %}
  <section class="welcome-container">
    <div class="welcome-content">
      <h1 class="welcome-title">Welcome to Team Task Manager</h1>
      <p class="welcome-message">Sign in if you already have an account</p>
      <div class="auth-buttons">
        <a href="{% url 'login' %}" class="btn btn-signin">Sign in</a>
        <p class="text">Or</p>
        <a href="{% url 'taskmanager:create_user' %}" class="btn btn-register">Register</a>
      </div>
      <p class="text">Register and start using Task Manager</p>
    </div>
  </section>
{% endblock %}
