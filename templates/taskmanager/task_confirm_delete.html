{% extends "base.html" %}

{% block content %}
  <div class="delete-container">
    <h1 class="delete-title">Delete Task?</h1>
    <p class="delete-message">Are you sure you want to delete this task?</p>

    <form method="POST" class="delete-form">
      {% csrf_token %}
      <input type="submit" value="Yes, Delete" class="btn delete-btn">
    </form>
    <a href="{% url 'taskmanager:task_detail' pk=task.pk %}" class="btn btn-cancel">Cancel</a>
  </div>
{% endblock %}
